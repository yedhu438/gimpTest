<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:sans-serif;background:#2b2b2b;color:#ccc;margin:0;padding:10px;font-size:12px}
  #status{color:#7ec87e;font-weight:bold;margin-bottom:8px;font-size:13px}
  #log{font-size:10px;color:#999;max-height:140px;overflow-y:auto;border-top:1px solid #444;padding-top:6px;margin-top:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ec87e;margin-right:5px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .err{color:#e24b4a}
  button{display:block;width:100%;margin:3px 0;padding:6px 10px;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px;text-align:left}
</style>
</head>
<body>
<div id="status"><span class="dot"></span>Starting...</div>
<button id="pickBtn"        style="background:#5a3a6a">📁 Set Root Folder (C:\gimpTest)</button>
<button id="mkCombinedBtn"  style="background:#2a6a3a">🔨 Create Combined Template</button>
<button id="mkAllTplBtn"    style="background:#6a3a2a">📦 Create All Product Templates</button>
<button id="resizeTplBtn"   style="background:#6a4a1a">📐 Resize Templates to 30000px</button>
<button id="buildBtn"       style="background:#3a6ea5">Build Zone Templates</button>
<div id="log"></div>
<script src="index.js"></script>
</body>
</html>
