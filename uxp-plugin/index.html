<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:sans-serif;background:#2b2b2b;color:#ccc;margin:0;padding:10px;font-size:12px}
  #status{color:#7ec87e;font-weight:bold;margin-bottom:8px;font-size:13px}
  #log{font-size:10px;color:#999;max-height:80px;overflow-y:auto;border-top:1px solid #444;padding-top:6px;margin-top:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ec87e;margin-right:5px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .err{color:#e24b4a}
</style>
</head>
<body>
<div id="status"><span class="dot"></span>Starting...</div>
<button id="buildBtn" style="margin:4px 0;padding:5px 10px;background:#3a6ea5;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:11px">Build Templates (front)</button>
<div id="log"></div>
<script>
const {app,core,action,constants} = require("photoshop");
const uxp = require("uxp");
const fs  = uxp.storage.localFileSystem;

const POLL_MS = 3000;
let DATA_FOLDER=null, JOBS_FOLDER=null, DONE_FOLDER=null, ERROR_FOLDER=null;
let processing = false;

// ── Helpers ────────────────────────────────────────────────────────────────────
function ts(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function log(msg,isErr){
  console.log("[Varsany] "+msg);
  document.getElementById("log").innerHTML=`<span class="${isErr?"err":""}">[${ts()}] ${msg}</span><br>`+document.getElementById("log").innerHTML;
  if(!isErr) document.getElementById("status").innerHTML='<span class="dot"></span>'+msg;
}

async function getOrCreate(parent,name){
  try{return await parent.getEntry(name);}
  catch(e){return await parent.createFolder(name);}
}

async function initFolders(){
  DATA_FOLDER  = await fs.getDataFolder();
  JOBS_FOLDER  = await getOrCreate(DATA_FOLDER,"jobs");
  DONE_FOLDER  = await getOrCreate(DATA_FOLDER,"done");
  ERROR_FOLDER = await getOrCreate(DATA_FOLDER,"error");
  log("Ready: "+DATA_FOLDER.nativePath);
}

async function readJSON(entry){
  const c = await entry.read({format:uxp.storage.formats.utf8});
  return JSON.parse(c);
}

async function writeJSON(folder,filename,data){
  const f = await folder.createFile(filename,{overwrite:true});
  await f.write(JSON.stringify(data,null,2),{format:uxp.storage.formats.utf8});
}

// ── Get entry by relative path from DATA_FOLDER ────────────────────────────────
async function getDataEntry(relPath){
  const parts = relPath.replace(/\\/g,"/").split("/").filter(Boolean);
  let entry = DATA_FOLDER;
  for(const part of parts) entry = await entry.getEntry(part);
  return entry;
}

// ── Find image entry — searches images/ folder by filename ────────────────────
async function getImageEntry(imgPath){
  const baseName = imgPath.replace(/\\/g,"/").split("/").pop();
  const imagesFolder = await getOrCreate(DATA_FOLDER,"images");
  const entries = await imagesFolder.getEntries();
  const match = entries.find(e => e.name === baseName || e.name.endsWith("_"+baseName));
  if(!match) throw new Error("Image not found: "+baseName);
  return match;
}

// ── Get or create output file entry ──────────────────────────────────────────
async function getOutputEntry(filename){
  const outFolder = await getOrCreate(DATA_FOLDER,"output");
  try{ return await outFolder.getEntry(filename); }
  catch(e){ return await outFolder.createFile(filename,{overwrite:true}); }
}

// ── Find layer recursively ────────────────────────────────────────────────────
function findLayer(layers,name){
  for(const l of layers){
    if(l.name===name) return l;
    if(l.layers){const f=findLayer(l.layers,name);if(f)return f;}
  }
  return null;
}

// ── Process one job — ALL Photoshop ops inside single executeAsModal ──────────
async function processJob(jobEntry){
  let job, orderId = jobEntry.name.replace(".json","");

  try{
    job = await readJSON(jobEntry);
    orderId = job.order_id || orderId;
  }catch(e){
    await writeJSON(ERROR_FOLDER, jobEntry.name, {order_id:orderId, error:"Parse: "+e.message, failed_at:ts()});
    await jobEntry.delete();
    return;
  }

  log("Processing: "+orderId);

  // ── Pre-resolve ALL file entries BEFORE entering modal scope ─────────────
  // Entries are resolved here; tokens are created INSIDE modal scope
  let tplEntry, imgEntries={}, outEntry;
  try{
    const tplName = job.template.replace(/\\/g,"/").split("/").pop();
    tplEntry = await getDataEntry("templates/"+tplName);

    for(const [zone,data] of Object.entries(job.zones)){
      if(data.customer_image){
        const imgEntry = await getImageEntry(data.customer_image);
        imgEntries[zone] = imgEntry;
      }
    }

    const outName = job.output_path.replace(/\\/g,"/").split("/").pop();
    outEntry = await getOutputEntry(outName);

  }catch(e){
    await writeJSON(ERROR_FOLDER, jobEntry.name, {order_id:orderId, error:"File lookup: "+e.message, failed_at:ts()});
    await jobEntry.delete();
    return;
  }

  // ── All Photoshop operations inside ONE executeAsModal ────────────────────
  // Tokens are created and used immediately inside modal — they don't expire
  let success = false;
  let errorMsg = "";

  await core.executeAsModal(async()=>{
    let doc = null;
    try{
      // 1. Open template
      const tplToken = fs.createSessionToken(tplEntry);
      await action.batchPlay([{
        _obj:"open",
        null:{_path:tplToken,_kind:"local"},
        _options:{dialogOptions:"dontDisplay"}
      }],{synchronousExecution:true});
      doc = app.activeDocument;
      log("Opened: "+doc.name);

      // 2. Process each zone — place images first, then set text on top
      // PHASE 1: Open each image, copy, paste into template above CustomerImage layer
      // This guarantees text layer stays on top since template has CustomerText at top
      for(const [zone,data] of Object.entries(job.zones)){
        if(imgEntries[zone]){
          try{
            // Open image as separate document
            const imgToken = fs.createSessionToken(imgEntries[zone]);
            await action.batchPlay([{
              _obj:"open",
              null:{_path:imgToken,_kind:"local"},
              _options:{dialogOptions:"dontDisplay"}
            }],{synchronousExecution:true});
            const imgDoc = app.activeDocument;
            // Select all and copy
            await action.batchPlay([{_obj:"selectAll"}],{synchronousExecution:true});
            await action.batchPlay([{_obj:"copyMerged"}],{synchronousExecution:true});
            await imgDoc.close(constants.SaveOptions.DONOTSAVECHANGES);
            // Switch back to template
            app.activeDocument = doc;
            // Select CustomerImage placeholder — paste will land above it
            await action.batchPlay([{
              _obj:"select",
              null:{_ref:[{_ref:"layer",_name:"CustomerImage_"+zone}]}
            }],{synchronousExecution:true});
            // Paste in place
            await action.batchPlay([{_obj:"paste",inPlace:true}],{synchronousExecution:true});
            // Scale pasted layer to fit canvas
            await action.batchPlay([{
              _obj:"rasterizeLayer",
              null:{_ref:[{_enum:"ordinal",_value:"targetEnum",_ref:"layer"}]}
            }],{synchronousExecution:true});
            log("Placed image: "+zone);
          }catch(e){ log("Place error ("+zone+"): "+e.message, true); }
        }
      }

      // PHASE 2: Set text + move to top AFTER all images placed
      for(const [zone,data] of Object.entries(job.zones)){
        if(data.text_lines?.length){
          const layer = findLayer(doc.layers, "CustomerText_"+zone);
          if(layer && layer.kind === "text"){
            const text = data.text_lines.join("\n");
            // Target: longest text line fills ~80% of canvas width.
            // Use the CURRENT doc width (post image fit-and-trim), so text is
            // sized to the final canvas — falls back to the job's value.
            const canvasWpx = Number(doc.width) || job.canvas_w_px;
            const targetPx  = canvasWpx * 0.80;
            const hex = data.colour_hex || "#ffffff";
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);

            // Apply text content + style at a given point size.
            async function applyText(sizePt){
              await action.batchPlay([{
                _obj: "set",
                null: { _ref: [{ _ref: "layer", _name: "CustomerText_"+zone }] },
                to: {
                  _obj: "textLayer",
                  textKey: text,
                  textStyleRange: [{
                    _obj: "textStyleRange",
                    from: 0,
                    to: text.length,
                    textStyle: {
                      _obj: "textStyle",
                      size: { _unit: "pointsUnit", _value: sizePt },
                      color: { _obj: "RGBColor", red: r, green: g, blue: b }
                    }
                  }],
                  paragraphStyleRange: [{
                    _obj: "paragraphStyleRange",
                    from: 0,
                    to: text.length,
                    paragraphStyle: {
                      _obj: "paragraphStyle",
                      alignment: { _enum: "alignmentType", _value: "center" }
                    }
                  }]
                }
              }],{synchronousExecution:true});
            }

            // Measure the rendered text width via the layer's bounds, then
            // scale toward targetPx. Two passes converge on the right size
            // for the actual font/glyphs instead of a char-count heuristic.
            let sizePt = 100;
            try{
              await applyText(sizePt);
              for(let pass=0; pass<2; pass++){
                const b0 = layer.bounds;
                const widthPx = (b0.right - b0.left) || 1;
                sizePt = Math.min(Math.max(sizePt * (targetPx / widthPx), 20), 400);
                await applyText(sizePt);
              }
            }catch(e){
              log("Text measure fallback ("+zone+"): "+e.message, true);
              sizePt = Math.min(Math.max(sizePt, 20), 400);
              await applyText(sizePt);
            }
            const clampedPt = Math.round(sizePt);

            // Always centre horizontally on the canvas.
            await action.batchPlay([{
              _obj: "align",
              null: { _ref: [{ _enum: "ordinal", _value: "targetEnum", _ref: "layer" }] },
              using: { _enum: "alignDistributeSelector", _value: "ADSCentersH" },
              alignToCanvas: true
            }],{synchronousExecution:true});

            if(imgEntries[zone]){
              // DEFAULT for image+text: overlay the text on the BOTTOM of the
              // image. No canvas growth — the text sits over the lower part of
              // the artwork (overlap is intentional, so it's visible). The text
              // layer stays on top and editable for tweaks before ripping.
              await action.batchPlay([{
                _obj: "align",
                null: { _ref: [{ _enum: "ordinal", _value: "targetEnum", _ref: "layer" }] },
                using: { _enum: "alignDistributeSelector", _value: "ADSBottoms" },
                alignToCanvas: true
              }],{synchronousExecution:true});
              // Nudge up a small margin so glyphs aren't flush against the edge.
              const margin = Math.round(Number(doc.height) * 0.04);
              if(margin > 0){
                await action.batchPlay([{
                  _obj:"move",
                  _target:[{_ref:"layer",_enum:"ordinal",_value:"targetEnum"}],
                  to:{_obj:"offset",horizontal:{_unit:"pixelsUnit",_value:0},vertical:{_unit:"pixelsUnit",_value:-margin}}
                }],{synchronousExecution:true});
              }
              log("Text on image bottom: "+zone+" ("+clampedPt+"pt)");
            } else {
              // Text-only zone: centre vertically on the canvas as well.
              await action.batchPlay([{
                _obj: "align",
                null: { _ref: [{ _enum: "ordinal", _value: "targetEnum", _ref: "layer" }] },
                using: { _enum: "alignDistributeSelector", _value: "ADSCentersV" },
                alignToCanvas: true
              }],{synchronousExecution:true});
              log("Text set: "+zone+" ("+clampedPt+"pt)");
            }
          } else {
            log("Text layer not found: CustomerText_"+zone, true);
          }
        }
      }

      // 3. Save PSD — token created and used immediately
      const outToken = fs.createSessionToken(outEntry);
      await action.batchPlay([{
        _obj:"save",
        null:{_ref:[{_enum:"ordinal",_value:"targetEnum",_ref:"document"}]},
        in:{_path:outToken,_kind:"local"},
        as:{_obj:"photoshop35Format",embedProfiles:true}
      }],{synchronousExecution:true});
      log("Saved: "+outEntry.name);

      // 4. Close
      await doc.close(constants.SaveOptions.DONOTSAVECHANGES);
      doc = null;
      success = true;

    }catch(e){
      errorMsg = e.message || String(e);
      if(doc) try{await doc.close(constants.SaveOptions.DONOTSAVECHANGES);}catch(x){}
    }
  },{commandName:"Process "+orderId});

  // ── Write result outside modal scope ─────────────────────────────────────
  if(success){
    await writeJSON(DONE_FOLDER, jobEntry.name, {
      order_id: orderId,
      output_filename: outEntry.name,
      completed_at: ts()
    });
    await jobEntry.delete();
    log("Done: "+orderId);
  } else {
    await writeJSON(ERROR_FOLDER, jobEntry.name, {
      order_id: orderId,
      error: errorMsg,
      failed_at: ts()
    });
    try{await jobEntry.delete();}catch(x){}
    log("Error: "+orderId+" — "+errorMsg, true);
  }
}

// ── Poll loop ─────────────────────────────────────────────────────────────────
async function pollJobs(){
  if(processing || !JOBS_FOLDER) return;
  processing = true;
  try{
    const entries = await JOBS_FOLDER.getEntries();
    const jobs = entries
      .filter(e => e.name.endsWith(".json"))
      .sort((a,b) => a.name < b.name ? -1 : 1);
    if(jobs.length > 0){
      log("Found "+jobs.length+" job(s)");
      await processJob(jobs[0]);
    }
  }catch(e){ log("Poll error: "+e.message, true); }
  processing = false;
}

// ── Template generator ─────────────────────────────────────────────────────────
// One-time: reads catalog.json (bundled in plugin) and creates a blank PSD per
// UNIQUE front canvas size, named <W>x<H>.psd. Products that share a size share
// one template. Each PSD: CMYK 8-bit, 320ppi, transparent, SWOP profile, with a
// CustomerText_front text layer and an Artwork_front placeholder layer.
async function generateTemplates(){
  if(!DATA_FOLDER){ log("Not ready yet", true); return; }
  if(processing){ log("Busy — try again in a moment", true); return; }
  processing = true;
  try{
    // Read catalog.json from the plugin's own folder
    let catalog;
    try{
      const pf   = await fs.getPluginFolder();
      const meta = await pf.getEntry("metadata");
      const cat  = await meta.getEntry("catalog.json");
      catalog = JSON.parse(await cat.read({format:uxp.storage.formats.utf8}));
    }catch(e){ log("catalog.json read error: "+e.message, true); return; }

    // One template per product (front zone), named <product>_front.psd for
    // easy identification — matches the owner's PRODUCT_CANVAS keys.
    const items = [];
    for(const [prod,zones] of Object.entries(catalog.products||{})){
      const front = zones.front;
      if(!front) continue;
      items.push({prod, w:front.width_px, h:front.height_px});
    }
    const tplFolder = await getOrCreate(DATA_FOLDER, "templates");
    log("Building "+items.length+" template(s)...");

    await core.executeAsModal(async()=>{
      for(const s of items){
        const name = s.prod+"_front.psd";
        try{
          // 1. Create document: CMYK 8-bit, 320ppi, transparent, SWOP
          await action.batchPlay([{
            _obj:"make",
            new:{
              _obj:"document",
              artboard:false,
              autoPromoteBackgroundLayer:false,
              preset:"Custom",
              width:{_unit:"pixelsUnit",_value:s.w},
              height:{_unit:"pixelsUnit",_value:s.h},
              resolution:{_unit:"densityUnit",_value:320},
              pixelScaleFactor:1,
              mode:{_class:"CMYKColorMode"},
              fill:{_enum:"fill",_value:"transparent"},
              depth:8,
              profile:"U.S. Web Coated (SWOP) v2"
            }
          }],{synchronousExecution:true});

          // 2. Artwork placeholder layer (empty pixel layer)
          await action.batchPlay([{_obj:"make",_target:[{_ref:"layer"}]}],{synchronousExecution:true});
          await action.batchPlay([{
            _obj:"set",
            _target:[{_ref:"layer",_enum:"ordinal",_value:"targetEnum"}],
            to:{_obj:"layer",name:"Artwork_front"}
          }],{synchronousExecution:true});

          // 3. Text layer (ends on top), renamed to CustomerText_front
          await action.batchPlay([{
            _obj:"make",
            _target:[{_ref:"textLayer"}],
            using:{
              _obj:"textLayer",
              textKey:"Your text here",
              textClickPoint:{_obj:"paint",
                horizontal:{_unit:"percentUnit",_value:50},
                vertical:{_unit:"percentUnit",_value:50}},
              textStyleRange:[{_obj:"textStyleRange",from:0,to:14,
                textStyle:{_obj:"textStyle",size:{_unit:"pointsUnit",_value:100}}}]
            }
          }],{synchronousExecution:true});
          await action.batchPlay([{
            _obj:"set",
            _target:[{_ref:"layer",_enum:"ordinal",_value:"targetEnum"}],
            to:{_obj:"layer",name:"CustomerText_front"}
          }],{synchronousExecution:true});

          // 4. Save as PSD into templates/
          const f = await tplFolder.createFile(name,{overwrite:true});
          const token = fs.createSessionToken(f);
          await action.batchPlay([{
            _obj:"save",
            as:{_obj:"photoshop35Format",maximizeCompatibility:true},
            in:{_path:token,_kind:"local"}
          }],{synchronousExecution:true});

          await app.activeDocument.close(constants.SaveOptions.DONOTSAVECHANGES);
          log("Template: "+name+" ("+s.w+"x"+s.h+")");
        }catch(e){
          log("Template error "+name+": "+(e.message||e), true);
          try{ await app.activeDocument.close(constants.SaveOptions.DONOTSAVECHANGES); }catch(x){}
        }
      }
    },{commandName:"Build Varsany templates"});
    log("Template build complete → "+tplFolder.nativePath);
  }catch(e){ log("Build error: "+e.message, true); }
  finally{ processing = false; }
}

// ── Start ─────────────────────────────────────────────────────────────────────
initFolders().then(()=>{
  document.getElementById("buildBtn").addEventListener("click", generateTemplates);
  setInterval(pollJobs, POLL_MS);
  log("Varsany worker polling every "+(POLL_MS/1000)+"s");
}).catch(e => log("Init error: "+e.message, true));
</script>
</body>
</html>
