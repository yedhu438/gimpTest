<!DOCTYPE html>
<html>
<head>
<style>
  body{font-family:sans-serif;background:#2b2b2b;color:#ccc;margin:0;padding:10px;font-size:12px}
  #status{color:#7ec87e;font-weight:bold;margin-bottom:8px;font-size:13px}
  #log{font-size:10px;color:#999;max-height:80px;overflow-y:auto;border-top:1px solid #444;padding-top:6px;margin-top:6px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7ec87e;margin-right:5px;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .err{color:#e24b4a}
</style>
</head>
<body>
<div id="status"><span class="dot"></span>Starting...</div>
<div id="log"></div>
<script>
const {app,core,action,constants} = require("photoshop");
const uxp   = require("uxp");
const fs    = uxp.storage.localFileSystem;

const POLL_MS = 3000;
let DATA_FOLDER=null, JOBS_FOLDER=null, DONE_FOLDER=null, ERROR_FOLDER=null;
let processing = false;

function ts(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}

function log(msg,isErr){
  console.log("[Varsany] "+msg);
  document.getElementById("log").innerHTML=`<span class="${isErr?"err":""}">[${ts()}] ${msg}</span><br>`+document.getElementById("log").innerHTML;
  if(!isErr) document.getElementById("status").innerHTML='<span class="dot"></span>'+msg;
}

async function getOrCreate(parent, name){
  try{return await parent.getEntry(name);}
  catch(e){return await parent.createFolder(name);}
}

async function initFolders(){
  DATA_FOLDER  = await fs.getDataFolder();
  JOBS_FOLDER  = await getOrCreate(DATA_FOLDER,"jobs");
  DONE_FOLDER  = await getOrCreate(DATA_FOLDER,"done");
  ERROR_FOLDER = await getOrCreate(DATA_FOLDER,"error");
  log("Ready: "+DATA_FOLDER.nativePath);
}

async function readJSON(entry){
  const c = await entry.read({format:uxp.storage.formats.utf8});
  return JSON.parse(c);
}

async function writeJSON(folder,filename,data){
  const f = await folder.createFile(filename,{overwrite:true});
  await f.write(JSON.stringify(data,null,2),{format:uxp.storage.formats.utf8});
}

// Get a session token for a file inside the plugin data folder
// filePath is relative to DATA_FOLDER, e.g. "templates/adulttshirt.psd"
async function tokenForRelPath(relPath){
  const parts = relPath.replace(/\\/g,"/").split("/");
  let entry = DATA_FOLDER;
  for(const part of parts) entry = await entry.getEntry(part);
  return fs.createSessionToken(entry);
}

async function tokenForImage(imgPath){
  // imgPath may be a full path or just a filename
  // Images are copied to plugin-data/images/ by ps_bridge.py
  // The filename in images/ folder may have an order_id prefix
  const imagesFolder = await getOrCreate(DATA_FOLDER,"images");
  const entries = await imagesFolder.getEntries();
  // Try exact filename first
  const baseName = imgPath.replace(/\\/g,"/").split("/").pop();
  // Find any entry whose name ends with the base filename
  const match = entries.find(e => e.name === baseName || e.name.endsWith("_"+baseName));
  if(!match) throw new Error("Image not found in images folder: "+baseName);
  return fs.createSessionToken(match);
}

// Get session token for output file (creates it if needed)
async function tokenForOutput(outputFilename){
  const outFolder = await getOrCreate(DATA_FOLDER,"output");
  let outEntry;
  try{ outEntry = await outFolder.getEntry(outputFilename); }
  catch(e){ outEntry = await outFolder.createFile(outputFilename,{overwrite:true}); }
  return fs.createSessionToken(outEntry);
}

async function openWithToken(token){
  await core.executeAsModal(async()=>{
    await action.batchPlay([{
      _obj:"open",
      null:{_path:token,_kind:"local"},
      _options:{dialogOptions:"dontDisplay"}
    }],{synchronousExecution:true});
  },{commandName:"Open template"});
  return app.activeDocument;
}

async function saveWithToken(token){
  await core.executeAsModal(async()=>{
    await action.batchPlay([{
      _obj:"save",
      null:{_ref:[{_enum:"ordinal",_value:"targetEnum",_ref:"document"}]},
      in:{_path:token,_kind:"local"},
      as:{_obj:"photoshop35Format",embedProfiles:true}
    }],{synchronousExecution:true});
  },{commandName:"Save PSD"});
}

async function placeImageWithToken(token,layerName){
  try{
    await action.batchPlay([{
      _obj:"placeEvent",
      null:{_path:token,_kind:"local"},
      freeTransformCenterState:{_enum:"quadCenterState",_value:"QCSAverage"}
    }],{synchronousExecution:true});
    app.activeDocument.activeLayer.name = layerName;
    await action.batchPlay([{
      _obj:"rasterizeLayer",
      null:{_ref:[{_enum:"ordinal",_value:"targetEnum",_ref:"layer"}]}
    }],{synchronousExecution:true});
    log("Placed: "+layerName);
  }catch(e){log("Place error: "+e.message,true);}
}

function findLayer(layers,name){
  for(const l of layers){
    if(l.name===name) return l;
    if(l.layers){const f=findLayer(l.layers,name);if(f)return f;}
  }
  return null;
}

async function setTextLayer(doc,layerName,lines,hex,font){
  const layer=findLayer(doc.layers,layerName);
  if(!layer){log("Layer not found: "+layerName,true);return;}
  await core.executeAsModal(async()=>{
    layer.textItem.contents=lines.join("\n");
    if(hex?.startsWith("#")) layer.textItem.color={red:parseInt(hex.slice(1,3),16),green:parseInt(hex.slice(3,5),16),blue:parseInt(hex.slice(5,7),16)};
    if(font) try{layer.textItem.font=font;}catch(e){}
  },{commandName:"Set text"});
}

async function processJob(jobEntry){
  let job,orderId=jobEntry.name.replace(".json","");
  try{job=await readJSON(jobEntry);orderId=job.order_id||orderId;}
  catch(e){
    await writeJSON(ERROR_FOLDER,jobEntry.name,{order_id:orderId,error:"Parse: "+e.message,failed_at:ts()});
    await jobEntry.delete();return;
  }

  log("Processing: "+orderId);

  await core.executeAsModal(async()=>{
    let doc=null;
    try{
      const tplName=job.template.replace(/\\/g,"/").split("/").pop();
      const tplToken=await tokenForRelPath("templates/"+tplName);
      await action.batchPlay([{_obj:"open",null:{_path:tplToken,_kind:"local"},_options:{dialogOptions:"dontDisplay"}}],{synchronousExecution:true});
      doc=app.activeDocument;

      for(const [zone,data] of Object.entries(job.zones)){
        if(data.customer_image){
          const imgName=data.customer_image.replace(/\\/g,"/").split("/").pop();
          const imgToken=await tokenForImage(imgName);
          try{
            await action.batchPlay([{_obj:"placeEvent",null:{_path:imgToken,_kind:"local"},freeTransformCenterState:{_enum:"quadCenterState",_value:"QCSAverage"}}],{synchronousExecution:true});
            app.activeDocument.activeLayer.name="CustomerImage_"+zone;
            await action.batchPlay([{_obj:"rasterizeLayer",null:{_ref:[{_enum:"ordinal",_value:"targetEnum",_ref:"layer"}]}}],{synchronousExecution:true});
            log("Placed image: "+zone);
          }catch(e){log("Place error: "+e.message,true);}
        }
        if(data.text_lines?.length){
          const layer=findLayer(doc.layers,"CustomerText_"+zone);
          if(layer){
            layer.textItem.contents=data.text_lines.join("\n");
            if(data.colour_hex?.startsWith("#")) layer.textItem.color={red:parseInt(data.colour_hex.slice(1,3),16),green:parseInt(data.colour_hex.slice(3,5),16),blue:parseInt(data.colour_hex.slice(5,7),16)};
            if(data.font_name) try{layer.textItem.font=data.font_name;}catch(e){}
            log("Text set: "+zone);
          }
        }
      }

      const outName=job.output_path.replace(/\\/g,"/").split("/").pop();
      const outToken=await tokenForOutput(outName);
      await action.batchPlay([{_obj:"save",null:{_ref:[{_enum:"ordinal",_value:"targetEnum",_ref:"document"}]},in:{_path:outToken,_kind:"local"},as:{_obj:"photoshop35Format",embedProfiles:true}}],{synchronousExecution:true});
      log("Saved: "+outName);
      await doc.close(constants.SaveOptions.DONOTSAVECHANGES);
      doc=null;

      await writeJSON(DONE_FOLDER,jobEntry.name,{order_id:orderId,output_filename:outName,completed_at:ts()});
      await jobEntry.delete();
      log("Done: "+orderId);

    }catch(e){
      if(doc) try{await doc.close(constants.SaveOptions.DONOTSAVECHANGES);}catch(x){}
      await writeJSON(ERROR_FOLDER,jobEntry.name,{order_id:orderId,error:e.message||String(e),failed_at:ts()});
      try{await jobEntry.delete();}catch(x){}
      log("Error: "+orderId+" — "+(e.message||e),true);
    }
  },{commandName:"Process order "+orderId});
}

async function pollJobs(){
  if(processing||!JOBS_FOLDER) return;
  processing=true;
  try{
    const entries=await JOBS_FOLDER.getEntries();
    const jobs=entries.filter(e=>e.name.endsWith(".json")).sort((a,b)=>a.name<b.name?-1:1);
    if(jobs.length>0){log("Found "+jobs.length+" job(s)");await processJob(jobs[0]);}
  }catch(e){log("Poll error: "+e.message,true);}
  processing=false;
}

initFolders().then(()=>{
  setInterval(pollJobs,POLL_MS);
  log("Varsany worker polling every "+(POLL_MS/1000)+"s");
}).catch(e=>log("Init error: "+e.message,true));
</script>
</body>
</html>
